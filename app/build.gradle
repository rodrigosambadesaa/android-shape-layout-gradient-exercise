plugins { id 'com.android.application' }
android {
    namespace 'com.example.shapelayoutgradient'
    compileSdk 37
    defaultConfig {
        applicationId 'com.example.shapelayoutgradient'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
    }
    buildFeatures { viewBinding true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.8.0'; testImplementation 'junit:junit:4.13.2' }
